<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#77216F"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F2F2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Top button -->
  <rect x="56" y="8" width="16" height="12" rx="3" fill="#5E2750"/>
  <rect x="52" y="18" width="24" height="6" rx="2" fill="#77216F"/>

  <!-- Left/Right bell buttons -->
  <rect x="25" y="16" width="14" height="8" rx="3" transform="rotate(-30 32 20)" fill="#77216F"/>
  <rect x="89" y="20" width="14" height="8" rx="3" transform="rotate(30 96 24)" fill="#77216F"/>

  <!-- Main Body -->
  <circle cx="64" cy="72" r="50" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Dial Face -->
  <circle cx="64" cy="72" r="42" fill="url(#dialGrad)"/>

  <!-- Dial Ticks -->
  <line x1="64" y1="36" x2="64" y2="42" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="72" x2="94" y2="72" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="108" x2="64" y2="102" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="72" x2="34" y2="72" stroke="#333333" stroke-width="3" stroke-linecap="round"/>

  <!-- Secondary Ticks -->
  <line x1="89.5" y1="46.5" x2="85" y2="51" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="89.5" y1="97.5" x2="85" y2="93" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="38.5" y1="97.5" x2="43" y2="93" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
  <line x1="38.5" y1="46.5" x2="43" y2="51" stroke="#888888" stroke-width="2" stroke-linecap="round"/>

  <!-- Timer Hands -->
  <!-- Hour hand -->
  <line x1="64" y1="72" x2="64" y2="52" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="64" y1="72" x2="82" y2="62" stroke="#E95420" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="64" cy="72" r="4.5" fill="#E95420"/>
  <circle cx="64" cy="72" r="2" fill="#FFFFFF"/>
</svg>
